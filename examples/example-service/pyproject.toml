[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "example-service"
version = "0.1.0"
description = "Minimal reference project for the workspace validation-gate setup"
requires-python = ">=3.9"

# Exact pins keep the gate deterministic: everyone (developer, Claude, CI)
# runs the same versions. Bump deliberately and re-run the full gate.
[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "ruff==0.12.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
